<!-- Contact Section -->
  <section class="contact_container">

    <!-- Left Info -->
    <div class="contact_info">
      <h3>GET IN TOUCH</h3>
      <h2>Let’s Build Something Extraordinary Together.</h2>
      <p>Have a project in mind or want to work together? We’d love to hear from you.</p>

      <div class="contact_details">
        <p><strong>Email:</strong> hello@architekt.com</p>
        <p><strong>Phone:</strong> +1 (123) 456-7890</p>
        <p><strong>Location:</strong> 123 Design Street, Studio City, California, USA</p>
      </div>
    </div>

    <!-- Contact Form -->
    <form class="contact_form">
      <label>Your Name</label>
      <input type="text" placeholder="Enter your name">

      <label>Your Email</label>
      <input type="email" placeholder="Enter your email">

      <label>Subject</label>
      <input type="text" placeholder="Enter subject">

      <label>Your Message</label>
      <textarea rows="5" placeholder="Write your message"></textarea>

      <button type="submit">Send Message →</button>
    </form>

    <!-- Right Image -->
    <div class="contact_image">
      <img src="https://images.unsplash.com/photo-1505691938895-1758d7feb511?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Modern Architecture">
    </div>

  </section>
